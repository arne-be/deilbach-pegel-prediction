.arrow { font-size: 18px; color: var(--foreground); }

<script id="logic">
// Pure logic, no DOM. In the real page CATS, ACTIONS, MODEL and the stale limit come from config/pegel.json.
const HOUR = 3600e3, STALE_MS = 90 * 60e3, MARKS = [3, 12, 24], MODEL = "ridge:change:v2";
const CATS = [
  { n: 1, name: "unkritisch", from: -Infinity },
  { n: 2, name: "kritisch", from: 145 },
  { n: 3, name: "sehr kritisch", from: 165 },
  { n: 4, name: "extrem kritisch", from: 185 },
  { n: 5, name: "Chaos", from: 225 },
];
// Barriers: README says Kat. 3 (above 165 cm); open question whether before 185 cm is enough.
const ACTIONS = [
  { level: 165, label: "165 cm", text: "Rückstauventil zu, Pumpe anschließen" },
  { level: 165, label: "Kat. 3", text: "Mobile Barrieren aufbauen" },
  { level: 185, label: "185 cm", text: "Sandsäcke im Hof auslegen" },
  { level: 225, label: "225 cm", text: "EG räumen, Strom abschalten" },
];

// Strictly above the threshold, as in core/categories.py: 145,0 cm is category 1.
function category(level) { let c = CATS[0]; for (const k of CATS) if (level > k.from) c = k; return c; }
function band(point, coverage) { return point.bands.find((b) => b.coverage_percent === coverage) || null; }
function upper90(point) { const b = band(point, 90); return b ? b.upper_cm : null; }
// Whole cm in big numbers.
function fmtInt(v) { return Math.round(v).toLocaleString("de-DE"); }

const berlin = (opts) => new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", ...opts });
const fTime = berlin({ hour: "2-digit", minute: "2-digit" });
const fDate = berlin({ year: "numeric", month: "2-digit", day: "2-digit" });
const fWeekday = berlin({ weekday: "short" });
const fHour = berlin({ hour: "numeric", hourCycle: "h23" });
function berlinHour(ms) { return Number(fHour.formatToParts(new Date(ms)).find((p) => p.type === "hour").value); }
function berlinDayIndex(ms) { const [d, m, y] = fDate.format(new Date(ms)).split("."); return Date.UTC(+y, +m - 1, +d) / 864e5; }
function fmtClock(iso) { return fTime.format(new Date(iso)) + " Uhr"; }
// Forecast times to the hour; after midnight with the weekday ("Fr. 3 Uhr").
function hourLabel(iso, refMs) {
  const ms = Date.parse(iso), sameDay = berlinDayIndex(ms) === berlinDayIndex(refMs);
  return `${sameDay ? "" : fWeekday.format(new Date(ms)) + " "}${berlinHour(ms)} Uhr`;
}

function isFallback(forecast) {
  return forecast.model !== MODEL || forecast.points.length === 0 || forecast.points.every((p) => p.bands.length === 0);
}
// Windows by time since the newest observation, not by array index.
function pointsWithin(points, obsMs, hours) {
  return points.filter((p) => (Date.parse(p.valid_at) - obsMs) / HOUR <= hours + 0.1);
}
function windowSummary(points, obsMs, hours) {
  const w = pointsWithin(points, obsMs, hours);
  if (!w.length) return { hours, empty: true };
  let peak = w[0], upper = null;
  for (const p of w) {
    if (p.level_cm > peak.level_cm) peak = p;
    const u = upper90(p);
    if (u !== null && (upper === null || u > upper)) upper = u;
  }
  const cat = category(peak.level_cm), possibleCat = upper === null ? null : category(upper);
  return { hours, empty: false, peak, upper, cat, possible: possibleCat && possibleCat.n > cat.n ? possibleCat : null };
}
function firstAbove(points, threshold, value) { return points.find((p) => value(p) !== null && value(p) > threshold) || null; }
// Change over the last 3 hours, from the reading closest to 3 h before (within 10 min).
function trend3h(observations) {
  const last = observations[observations.length - 1], target = Date.parse(last.observed_at) - 3 * HOUR;
  const before = observations.find((o) => Math.abs(Date.parse(o.observed_at) - target) <= 10 * 60e3);
  return before ? last.level_cm - before.level_cm : null;
}
function trendArrow(t) {
  if (t === null) return "";
  if (Math.abs(t) < 2) return "→";
  if (Math.abs(t) < 8) return t > 0 ? "↗" : "↘";
  return t > 0 ? "↑" : "↓";
}
function freshness(forecast, newestObsIso, nowMs) {
  return { stale: nowMs - Date.parse(newestObsIso) > STALE_MS || nowMs - Date.parse(forecast.issued_at) > STALE_MS };
}
// mode: "fresh" gives a verdict; "stale" and "fallback" never do (no category, no green).
function summarize(forecast, history, nowMs) {
  const obs = history.observations, now = obs[obs.length - 1];
  const obsMs = Date.parse(forecast.newest_observation_at);
  const mode = freshness(forecast, now.observed_at, nowMs).stale ? "stale" : isFallback(forecast) ? "fallback" : "fresh";
  const pts = forecast.points;
  return {
    f: forecast, history: obs, now, nowMs, mode, trend: trend3h(obs),
    marks: MARKS.map((h) => windowSummary(pts, obsMs, h)), all: windowSummary(pts, obsMs, 24),
  };
}
// Expected (line) and possible (90 % top) times: the last point before the crossing,
// or the newest observation, because the crossing lies in between.
function actionPlan(s) {
  const pts = s.f.points;
  const before = (hit) => hit && (pts.indexOf(hit) > 0 ? pts[pts.indexOf(hit) - 1].valid_at : s.f.newest_observation_at);
  return ACTIONS.map((a) => ({ ...a, expectedFrom: before(firstAbove(pts, a.level, (p) => p.level_cm)), possibleFrom: before(firstAbove(pts, a.level, upper90)) }));
}

if (typeof module !== "undefined") module.exports = { CATS, category, windowSummary, summarize, actionPlan, fmtInt, hourLabel, trendArrow, freshness };
</script>

<script>
if (typeof document !== "undefined") (() => {
  const SAMPLES = JSON.parse(document.getElementById("data").textContent);
  const flood = SAMPLES.flood_made_up;
  const fallbackForecast = { ...flood.forecast, model: "persistence", situation: null,
    points: flood.forecast.points.map((p) => ({ valid_at: p.valid_at, level_cm: 128, bands: [] })) };
  // Mockup clock: "now" is fixed per state. The real page uses Date.now().
  const STATES = {
    normal: { forecast: SAMPLES.normal.forecast, history: SAMPLES.normal.history, now: "2026-10-16T09:41:00Z" },
    flood: { forecast: flood.forecast, history: flood.history, now: "2026-11-19T15:41:00Z" },
    stale: { forecast: flood.forecast, history: flood.history, now: "2026-11-19T17:40:00Z" },
    fallback: { forecast: fallbackForecast, history: flood.history, now: "2026-11-19T15:41:00Z" },
    // Hash only (#shifted): flood sample 30 cm lower, line in Kat. 1, 90 % top in Kat. 2.
    shifted: { forecast: { ...flood.forecast, points: flood.forecast.points.map((p) => ({ valid_at: p.valid_at, level_cm: p.level_cm - 30,
      bands: p.bands.map((b) => ({ ...b, lower_cm: b.lower_cm - 30, upper_cm: b.upper_cm - 30 })) })) }, history: flood.history, now: "2026-11-19T15:41:00Z" },
  };
  const $ = (id) => document.getElementById(id);
  const cat = (c, maybe = false) => maybe ? `<span class="cat maybe">${c.n}</span>` : `<span class="cat" style="background:var(--c${c.n});color:var(--c${c.n}-ink)">${c.n}</span>`;
  let current = "normal", last = null;

  function render(state) {
    const st = STATES[state];
    last = summarize(st.forecast, st.history, Date.parse(st.now));
    renderStatus(last);
    renderChart(last);
    renderActions(last);
  }

  function renderStatus(s) {
    const portal = `<a class="link" href="https://www.hochwasserportal.nrw.de" rel="noopener">Hochwasserportal NRW →</a>`;
    if (s.mode === "stale") { $("status").innerHTML = `<span class="badge">Veraltet · ${fmtClock(s.now.observed_at)}</span>${portal}`; return; }
    if (s.mode === "fallback") { $("status").innerHTML = `<span class="badge">Keine Prognose · ${fmtClock(s.now.observed_at)}</span>${portal}`; return; }
    const E = s.all.cat, P = s.all.possible;
    $("status").innerHTML = `${cat(E)}<span>${E.name}</span>` + (P ? cat(P, true) : "");
  }

  function renderChart(s) {
    const box = $("chart"), W = Math.max(300, box.clientWidth), phone = W < 640;
    const boxTop = box.getBoundingClientRect().top + scrollY;
    const H = Math.round(Math.min(phone ? 680 : 600, Math.max(420, innerHeight - boxTop - 24)));
    const fresh = s.mode === "fresh", showForecast = fresh;
    const m = { l: 0, r: 0, t: fresh ? 84 : 16, b: 24 }, pw = W - m.l - m.r;
    const obsT = Date.parse(s.now.observed_at), t0 = obsT - 24 * HOUR, t1 = obsT + 24 * HOUR;
    // The last 24 h are context, so they get a quarter (phone) or a third of the width.
    const pastShare = phone ? 0.3 : 0.33;
    const x = (t) => t <= obsT ? m.l + ((t - t0) / (obsT - t0)) * pastShare * pw : m.l + pastShare * pw + ((t - obsT) / (t1 - obsT)) * (1 - pastShare) * pw;
    const pts = showForecast ? s.f.points : [];
    const hist = s.history.filter((o) => Date.parse(o.observed_at) >= t0 - 1);
    const top = Math.max(...pts.map((p) => upper90(p) ?? p.level_cm), ...hist.map((o) => o.level_cm));
    const yMax = Math.max(250, Math.ceil((top + 10) / 25) * 25);
    const y = (v) => m.t + (1 - v / yMax) * (H - m.t - m.b);
    const out = [], zones = [];

    CATS.forEach((c, i) => {
      const lo = Math.max(0, c.from), hi = Math.min(yMax, CATS[i + 1] ? CATS[i + 1].from : yMax);
      zones.push(`<rect x="${m.l}" y="${y(hi)}" width="${pw}" height="${y(lo) - y(hi)}" fill="var(--c${c.n})" fill-opacity="${c.n === 1 ? "var(--zone-a)" : "var(--zone-b)"}"/>`);
      if (c.n > 1) {
        zones.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${y(c.from)}" y2="${y(c.from)}" stroke="var(--c${c.n})" stroke-width="1.5"/>`);
      }
      out.push(`<text x="${W - m.r - 8}" y="${(y(lo) + y(hi)) / 2 + 5}" text-anchor="end" font-weight="700" font-size="16" style="fill:var(--foreground)">${c.n}</text>`);
    });

    let lastTick = -Infinity;
    for (let t = Math.ceil(t0 / HOUR) * HOUR; t <= t1; t += HOUR) {
      const hr = berlinHour(t);
      if (hr % 6 || (t < obsT && hr % 12)) continue;
      const label = hr === 0 ? fWeekday.format(new Date(t)) : `${hr} Uhr`;
      if (x(t) < m.l + 16 || x(t) > W - 24 || x(t) - lastTick < 44) continue;
      lastTick = x(t);
      out.push(`<text x="${x(t)}" y="${H - 6}" text-anchor="middle" ${hr === 0 ? 'font-weight="700"' : ""}>${label}</text>`);
      out.push(`<line x1="${x(t)}" x2="${x(t)}" y1="${H - m.b}" y2="${H - m.b + 4}" stroke="var(--muted-foreground)"/>`);
    }

    const start = { t: obsT, v: s.now.level_cm };
    const area = (cov) => {
      const bs = pts.map((p) => ({ t: Date.parse(p.valid_at), b: band(p, cov) })).filter((q) => q.b);
      if (!bs.length) return "";
      const up = [`${x(start.t)},${y(start.v)}`, ...bs.map((q) => `${x(q.t)},${y(q.b.upper_cm)}`)];
      const poly = `<polygon points="${[...up, ...bs.map((q) => `${x(q.t)},${y(q.b.lower_cm)}`).reverse()].join(" ")}" fill="var(--band${cov})"/>`;
      // The dashed top of the lighter band matches the dashed "möglich" box.
      return cov === 90 ? poly + `<polyline points="${up.join(" ")}" fill="none" stroke="var(--foreground)" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 3"/>` : poly;
    };
    const line = (arr) => arr.map((q, i) => `${i ? "L" : "M"}${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join("");
    const fcColor = fresh ? "var(--foreground)" : "var(--muted-foreground)";
    const fc = pts.length ? area(90) + area(80) + `<path d="${line([start, ...pts.map((p) => ({ t: Date.parse(p.valid_at), v: p.level_cm }))])}" fill="none" stroke="${fcColor}" stroke-width="2.6" stroke-dasharray="7 4"/>` : "";
    const histPath = `<path d="${line(hist.map((o) => ({ t: Date.parse(o.observed_at), v: o.level_cm })))}" fill="none" stroke="var(--foreground)" stroke-width="2.6"/>`;
    const dot = `<circle cx="${x(obsT)}" cy="${y(s.now.level_cm)}" r="7" fill="${s.mode === "stale" ? "var(--muted-foreground)" : "var(--foreground)"}" stroke="var(--card)" stroke-width="3"/>`;

    // HTML labels over the SVG: the three windows on top, the current level beside its dot.
    const labels = fresh ? s.marks.map((k) => k.empty ? "" :
      `<div class="mk" style="right:${W - x(obsT + k.hours * HOUR) + (k.hours === 24 ? 6 : 4)}px"><div class="mk-h">${k.hours} Std.</div>` +
      `<div class="mk-v">${fmtInt(k.peak.level_cm)}<small> cm</small></div><div class="mk-c">${k.cat.n > 1 ? cat(k.cat) : ""}${k.possible ? cat(k.possible, true) : ""}</div></div>`).join("") : "";
    const nowY = y(s.now.level_cm), above = nowY - 78 > m.t;
    const nowPos = above ? `bottom:${H - nowY + 12}px` : `top:${nowY + 12}px`;
    const nowLabel = `<div class="now" style="right:${W - x(obsT) + 10}px;${nowPos}">` +
      `<div class="now-l">${s.mode === "stale" ? "" : "Jetzt "}<b class="arrow">${trendArrow(s.trend)}</b></div>` +
      `<div class="now-v">${fmtInt(s.now.level_cm)}<small> cm</small></div><div class="now-t">${fmtClock(s.now.observed_at)}</div></div>`;

    box.className = fresh ? "" : s.mode === "stale" ? "grey stale" : "grey";
    box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><g class="zones">${zones.join("")}</g>${out.join("")}${fc}${histPath}${dot}</svg>${labels}${nowLabel}`;
    box.setAttribute("aria-label", fresh
      ? `Pegel jetzt ${fmtInt(s.now.level_cm)} cm. Höchststand in 3, 12 und 24 Stunden: ${s.marks.map((k) => fmtInt(k.peak.level_cm)).join(", ")} cm.`
      : `Zuletzt gemessen ${fmtInt(s.now.level_cm)} cm um ${fmtClock(s.now.observed_at)}. Keine aktuelle Prognose.`);
  }

  function renderActions(s) {
    $("actions").innerHTML = actionPlan(s).map((a) => {
      let when = "";
      if (s.mode === "fresh" && a.expectedFrom) when = `ab ${hourLabel(a.expectedFrom, s.nowMs)}`;
      else if (s.mode === "fresh" && a.possibleFrom) when = `möglich ab ${hourLabel(a.possibleFrom, s.nowMs)}`;
      return `<li><b>${a.label}</b><span>${a.text}</span>${when ? `<span class="when">${when}</span>` : ""}</li>`;
    }).join("");
  }

  function select(state) {
    current = state;
    document.querySelectorAll(".mock button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.state === state)));
    render(state);
  }
  document.querySelectorAll(".mock button").forEach((b) => b.addEventListener("click", () => { history.replaceState(null, "", "#" + b.dataset.state); select(b.dataset.state); }));
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h in STATES) select(h); });
  // Freshness can change while the page stays open overnight: re-check every minute and on return.
  setInterval(() => render(current), 60e3);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(current); });
  let resizeTimer;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => renderChart(last), 100); });
  const fromHash = location.hash.slice(1);
  select(fromHash in STATES ? fromHash : "normal");
  document.fonts && document.fonts.ready.then(() => renderChart(last));
})();
</script>
</body>
</html>
