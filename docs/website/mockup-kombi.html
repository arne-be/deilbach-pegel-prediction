<!doctype html>
<!--
  Mockup "Kombi": the verdict sentence of round-1 C, the Verlauf chart of round-1 B,
  the house and gauge staff of round-2 Pegellatte with the waves of round-2 Wasser,
  and the Zeitplan of round-1 A. Pointing at the chart (mouse, finger or arrow keys)
  moves the water at the house to the level at that hour.
  Open question for the client: barriers at 165 cm (start of Kat. 3) or 185 cm.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deilbach Pegel Vorhersage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..700&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  --background: oklch(99% .003 90); --foreground: oklch(20% .025 215);

  --accent: oklch(72% .18 50); --accent-foreground: oklch(18% .025 215);
  --muted: oklch(96% .008 210); --muted-foreground: oklch(48% .02 215);
  --border: oklch(90% .008 210); --card: #fff; --destructive: oklch(58% .22 27);
  --c1: oklch(66% .13 155); --c2: oklch(85% .15 92); --c3: oklch(55% .19 30);
  --c4: oklch(50% .2 25); --c5: oklch(34% .12 15); --grey: oklch(78% .01 215);
  --band80: oklch(36% .04 215 / .30); --band90: oklch(36% .04 215 / .14);
  /* illustration */
  --sky: oklch(97% .01 220); --ground: oklch(88% .025 80); --wall: oklch(74% .012 215);
  --water: oklch(62% .11 235); --water-back: oklch(72% .09 230); --water-line: oklch(48% .12 240);
  --house: oklch(36% .04 215); --window: oklch(92% .03 85);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --background: oklch(18% .025 215); --foreground: oklch(97% .005 90);
  --muted: oklch(24% .025 215); --muted-foreground: oklch(76% .02 215); --border: oklch(32% .025 215); --card: oklch(22% .025 215);
  --grey: oklch(45% .01 215); --band80: oklch(85% .04 215 / .32); --band90: oklch(85% .04 215 / .15);
  --sky: oklch(22% .025 215); --ground: oklch(33% .02 80); --wall: oklch(45% .012 215);
  --water: oklch(60% .1 235); --water-back: oklch(50% .08 235); --water-line: oklch(75% .1 235); --house: oklch(52% .04 215); --window: oklch(80% .06 85);
}}
:root[data-theme="dark"] {
  --background: oklch(18% .025 215); --foreground: oklch(97% .005 90);
  --muted: oklch(24% .025 215); --muted-foreground: oklch(76% .02 215); --border: oklch(32% .025 215); --card: oklch(22% .025 215);
  --grey: oklch(45% .01 215); --band80: oklch(85% .04 215 / .32); --band90: oklch(85% .04 215 / .15);
  --sky: oklch(22% .025 215); --ground: oklch(33% .02 80); --wall: oklch(45% .012 215);
  --water: oklch(60% .1 235); --water-back: oklch(50% .08 235); --water-line: oklch(75% .1 235); --house: oklch(52% .04 215); --window: oklch(80% .06 85);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font: 16px/1.5 Manrope, system-ui, sans-serif; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header.site { background: var(--background); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
header.site .wrap { display: flex; align-items: center; gap: 24px; height: 64px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand img { width: 40px; height: 40px; border-radius: 8px; display: block; }
.brand span { font: 700 13px "Space Grotesk", sans-serif; letter-spacing: .2em; }
header nav { flex: 1; display: none; justify-content: center; gap: 32px; font-size: 14px; color: var(--muted-foreground); }
header nav a { text-decoration: none; }
.pill { display: inline-block; border-radius: 99px; padding: 8px 18px; font: 600 12px Manrope, sans-serif; text-decoration: none; }
.pill.cta { background: var(--accent); color: var(--accent-foreground); text-transform: uppercase; letter-spacing: .03em; display: none; }
.burger { margin-left: auto; width: 24px; height: 24px; }
@media (min-width: 900px) { header nav { display: flex; } .pill.cta { display: inline-block; } .burger { display: none; } }

main { text-align: center; }
h1 { font: 500 clamp(1.6rem, 6vw, 2.8rem)/1.15 "Space Grotesk", sans-serif; text-transform: uppercase; letter-spacing: .08em; margin: 28px 0 12px; }
/* Verdict (round-1 C) */
.verdict { font-weight: 600; font-size: clamp(17px, 4.6vw, 22px); line-height: 1.5; margin: 0; }
.verdict .line { display: block; }
.verdict .when { white-space: nowrap; }
.chip { display: inline-block; padding: 1px 10px; border-radius: 99px; font: 700 .8em/1.5 Manrope, sans-serif; color: oklch(18% .025 215); vertical-align: .08em; white-space: nowrap; }
.chip.dark { color: #fff; }
.chip.ghost { background: transparent !important; color: var(--foreground); border: 2px dashed var(--chip); padding: 0 8px; }
.chip.off { background: var(--grey) !important; color: var(--foreground); }
.badge { display: inline-block; padding: 2px 12px; border-radius: 99px; border: 2px solid var(--foreground); font-weight: 700; font-size: 16px; }
.verdict a { font-size: 16px; margin-left: 8px; }
.nowrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 2px 10px; margin: 14px 0 0; }
.nowrow .big { font: 700 34px/1.1 "Space Grotesk", sans-serif; }
.nowrow .chip { font-size: 14px; }
.nowrow .sub { font-size: 14px; color: var(--muted-foreground); }
.dist { font-size: 15px; margin: 2px 0 0; }
.dist b { font-size: 18px; }
.is-old .nowrow .big, .is-old .dist b { color: var(--muted-foreground); }

.stage { max-width: 640px; margin: 24px auto 0; text-align: left; }
.card { background: var(--card); border-radius: 1rem; box-shadow: 0 1px 3px oklch(20% .025 215 / .08), 0 8px 24px oklch(20% .025 215 / .06); }
/* Chart (round-1 B) */
.chartcard { padding: 12px 10px; }
.chart { position: relative; touch-action: pan-y; cursor: crosshair; outline: none; border-radius: .5rem; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.chart.static { cursor: default; }
.chart:focus-visible { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--foreground); }
.chart svg { display: block; width: 100%; }
.chart text { font-family: Manrope, sans-serif; fill: var(--muted-foreground); font-size: 12px; }
.chart .strong { fill: var(--foreground); font-weight: 700; }
.chart .halo { paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-opacity: .85; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--muted-foreground); margin-top: 8px; white-space: nowrap; justify-content: center; }
.sw { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 3px; border-radius: 2px; }
/* House (round-2 Pegellatte) */
.scene { margin-top: 12px; overflow: hidden; }
.scene svg { display: block; width: 100%; height: auto; }
.scene text { font-family: Manrope, sans-serif; fill: var(--foreground); font-size: 13px; font-weight: 600; }
#curLine, #cue { transition: opacity .25s ease; }
@media (prefers-reduced-motion: reduce) { #curLine, #cue { transition: none; } }
.chart .cue { font-size: 16px; font-weight: 700; fill: var(--foreground); }
/* Zeitplan (round-1 A) */
.plansec { max-width: 640px; margin: 32px auto 0; text-align: left; }
.label { text-transform: uppercase; letter-spacing: .12em; font: 500 13px "Space Grotesk", sans-serif; color: var(--muted-foreground); margin: 0 0 8px; text-align: center; }
.plan { display: grid; gap: 10px; }
.plan .row { border-left: 6px solid var(--tone); padding: 8px 12px; background: var(--card); border-radius: 0 .5rem .5rem 0; border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.plan .row.maybe { border-left-style: dashed; }
.plan h3 { font-size: 16px; margin: 0; }
.plan .times { font-size: 14px; margin: 2px 0 4px; }
.plan ul { margin: 0; padding-left: 18px; font-size: 15px; }

.legal { margin: 32px 0 0; font-size: 14px; color: var(--muted-foreground); }
.legal a { color: oklch(55% .16 50); font-weight: 600; }
footer { margin-top: 40px; background: var(--brand-deep); color: var(--brand-foreground); font-size: 14px; }
footer .wrap { padding-top: 28px; padding-bottom: 28px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
.mock { display: flex; gap: 2px; opacity: .6; }
.mock button { font: 12px Manrope, sans-serif; border: 0; background: none; color: var(--brand-foreground); padding: 2px 6px; border-radius: 4px; cursor: pointer; }
.mock button[aria-pressed="true"] { text-decoration: underline; }
</style>
</head>

  now = state.now;
  S = summarize(state.sample, now);
  const ok = S.mode === "ok", cur = S.current;
  document.body.classList.toggle("is-old", S.mode === "stale");
  document.querySelectorAll(".mock button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.state === name));

  const v = S.verdict, reading = `${sameDay(cur.observed_at, now) ? "" : dayWord(cur.observed_at, now) + " "}${clock(cur.observed_at)}`;
  $("verdict").innerHTML = S.mode === "stale" ? `<span class="line"><span class="badge">Veraltet · ${reading}</span></span><span class="line">${PORTAL}</span>`
    : S.mode === "fallback" ? `<span class="line"><span class="badge">Keine Prognose · ${reading}</span></span><span class="line">${PORTAL}</span>`
    : verdictHtml(v);
  $("legalLink").hidden = !ok;   // stale and fallback show the portal link next to the badge instead
  $("now").innerHTML = `<span class="big">${num(cur.level_cm)} cm</span>${chip(categoryOf(cur.level_cm), S.mode === "stale" ? "off" : "")}<span class="sub">gemessen ${reading}</span>`;
  const gap = CRITICAL_CM - cur.level_cm;
  $("dist").innerHTML = gap > 0 ? `Bis kritisch (145 cm): noch <b>${num(Math.floor(gap))} cm</b>`
    : `Kritische Marke (145 cm) um <b>${num(Math.ceil(-gap))} cm</b> überschritten`;

  $("plansec").hidden = !S.plan.length;
  $("plan").innerHTML = planHtml(S.plan);

  scene = sceneGeometry();
  renderChart(state.sample);
  $("scene").innerHTML = sceneSvg();
  anim.homeIdx = S.series.length - 1 - (ok ? state.sample.forecast.points.length : 0);
  const hover = debugHover();
  if (hover) point(nearestIndex(S.series, Date.parse(hover)), true);
  else { anim.active = false; anim.targetIdx = anim.homeIdx; anim.shownMs = S.series[anim.homeIdx].ms; anim.bandOpacity = 0; }
  updateLabels();
  kick();
}

function verdictHtml(v) {
  const first = v.expectedAt ? `Voraussichtlich ${chip(v.expected)} <span class="when">${hourAt(v.expectedAt, now)}</span>`
    : v.expected.n === 1 ? `Voraussichtlich ${chip(v.expected)} in den nächsten 24 Stunden` : `Voraussichtlich weiter ${chip(v.expected)}`;
  const second = v.possible.map((p, i) => `${i ? "" : "Möglich: "}${chip(p.category, "ghost")} <span class="when">${hourAt(p.at, now, "ab")}</span>`).join(", ");
  return `<span class="line">${first}</span>` + (second ? `<span class="line">${second}</span>` : "");
}

function planHtml(rows) {
  return rows.map((r) => {
    const maybe = !r.now && !r.expectedAt;
    const times = r.now ? "jetzt überschritten" : r.expectedAt ? `erwartet ${hourAt(r.expectedAt, now)}` : `nicht erwartet · möglich ${hourAt(r.possibleAt, now, "ab")}`;
    const c = r.category;
    return `<div class="row${maybe ? " maybe" : ""}" style="--tone:${c.color}"><h3>Über ${c.from} cm · ${c.n} · ${c.name}</h3>
      <div class="times">${times}</div>
      <ul>${r.actions.map((a) => `<li>${a.info ? a.text : (maybe ? "Vorbereiten: " : "") + a.text}</li>`).join("")}</ul></div>`;
  }).join("");
}

// House geometry, 1 SVG unit = 1 cm: the scale top sits 20 units below the picture's top edge, the bed (-15) 15 above its bottom.
// On wide screens the picture extends to the left (more river), so it stays low; `pxPerCm` is shared with the chart.
function sceneGeometry() {
  const top = S.scaleTop, height = top + 50, w = $("scene").clientWidth || 360;
  const pxPerCm = Math.min(w / 360, 340 / 300);
  return { top, height, pxPerCm, sx: Math.max(0, Math.round(w / pxPerCm - 360)) };
}
const sy = (cm) => scene.top + 20 - Math.max(-20, Math.min(cm, scene.top + 5));
const STAFF_X = 232, WALL_X = 248;
const bankX = (cm) => (cm >= 145 ? -scene.sx : 30 + (145 - cm) / 160 * 55);  // left bank: 145 cm at x 30, bed at x 85

// Verlauf chart (round-1 B). Fixed scale from 0 to the shared top, with the house's px per cm.
function renderChart(sample) {
  const box = $("chart"), ok = S.mode === "ok", colored = S.mode !== "stale", W = Math.max(300, box.clientWidth || 300), phone = W < 500;
  const m = { l: 8, r: 8, t: 10, b: 26 }, yMax = S.scaleTop, H = m.t + m.b + yMax * scene.pxPerCm;
  const obsT = Date.parse(S.current.observed_at), pts = ok ? sample.forecast.points : [];
  const t0 = obsT - 24 * HOUR, t1 = obsT + 24 * HOUR + 10 * 60e3;
  const hist = S.series.filter((p) => !p.forecast);
  const x = (t) => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (v) => m.t + (1 - v / yMax) * (H - m.t - m.b);
  const out = [];
  CATEGORIES.forEach((c, i) => {
    const lo = Math.max(0, c.from), hi = Math.min(yMax, CATEGORIES[i + 1] ? CATEGORIES[i + 1].from : yMax);
    out.push(`<rect x="${m.l}" y="${y(hi)}" width="${W - m.l - m.r}" height="${y(lo) - y(hi)}" fill="${colored ? c.color : "var(--grey)"}" opacity="${colored ? (c.n === 1 ? 0.12 : 0.22) : 0.2}"/>`);
    if (c.n > 1) {
      out.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${y(c.from)}" y2="${y(c.from)}" stroke="${colored ? c.color : "var(--grey)"}" stroke-width="1.5"/>`);
      out.push(`<text class="strong halo" x="${W - m.r - 4}" y="${y(c.from) - 4}" text-anchor="end">${c.from} · ${c.n}</text>`);
    }
  });
  for (let t = Math.ceil(t0 / HOUR) * HOUR; t <= t1; t += HOUR) {
    const p = parts(new Date(t).toISOString()), hr = Number(p.hour);
    if (hr % (phone ? 12 : 6)) continue;
    out.push(`<line x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--border)" stroke-width="${hr === 0 ? 1.2 : 0.5}"/>`);
    if (x(t) < m.l + 18 || x(t) > W - m.r - 18) continue;   // a label at the edge would be clipped
    out.push(`<text x="${x(t)}" y="${H - 8}" text-anchor="middle" ${hr === 0 ? 'font-weight="700"' : ""}>${hr === 0 ? p.weekday : hr + " Uhr"}</text>`);
  }
  const start = { t: obsT, v: S.current.level_cm };
  const area = (cov) => {
    const bs = pts.map((p) => ({ t: Date.parse(p.valid_at), b: p.bands.find((b) => b.coverage_percent === cov) })).filter((q) => q.b);
    if (!bs.length) return "";
    const up = [`${x(start.t)},${y(start.v)}`, ...bs.map((q) => `${x(q.t)},${y(q.b.upper_cm)}`)];
    return `<polygon points="${[...up, ...bs.map((q) => `${x(q.t)},${y(q.b.lower_cm)}`).reverse()].join(" ")}" fill="var(--band${cov})"/>`;
  };
  out.push(area(90), area(80));
  const line = (arr) => arr.map((q, i) => `${i ? "L" : "M"}${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join("");
  const lineColor = S.mode === "stale" ? "var(--muted-foreground)" : "var(--foreground)";
  out.push(`<path d="${line(hist.map((o) => ({ t: o.ms, v: o.level })))}" fill="none" stroke="${lineColor}" stroke-width="2.2" stroke-linejoin="round"/>`);
  if (pts.length) out.push(`<path d="${line([start, ...pts.map((p) => ({ t: Date.parse(p.valid_at), v: p.level_cm }))])}" fill="none" stroke="var(--foreground)" stroke-width="2.6" stroke-dasharray="6 4"/>`);
  out.push(`<line x1="${x(obsT)}" x2="${x(obsT)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--foreground)" stroke-width="1"/>`);
  const nowMs = Date.parse(now);
  if (S.mode === "stale" && nowMs < t1) {
    out.push(`<line x1="${x(nowMs)}" x2="${x(nowMs)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--destructive)" stroke-width="2" stroke-dasharray="4 3"/>`);
    out.push(`<text x="${x(nowMs) + 4}" y="${H - m.b - 6}" font-weight="700" style="fill:var(--destructive)">jetzt</text>`);
  }
  out.push(`<circle cx="${x(obsT)}" cy="${y(S.current.level_cm)}" r="3.5" fill="${lineColor}"/>`);
  // Drag cue above the newest reading; gone while the cursor is away from it.
  if (S.series.length > 1) out.push(`<text id="cue" class="cue halo" x="${x(obsT)}" y="${y(S.current.level_cm) - 13}" text-anchor="middle" aria-hidden="true">↔</text>`);
  // Cursor: the dot always marks the shown hour (the newest reading at rest); the line appears while pointing.
  out.push(`<g pointer-events="none"><line id="curLine" y1="${m.t}" y2="${H - m.b}" stroke="var(--foreground)" stroke-width="1.5" stroke-opacity=".7" opacity="0"/>` +
    `<circle id="curDot" r="6" fill="var(--card)" stroke="${lineColor}" stroke-width="2.5"/></g>`);
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${out.join("")}</svg>`;
  box.setAttribute("aria-valuemin", 0);
  box.setAttribute("aria-valuemax", S.series.length - 1);
  $("legend").innerHTML = `<span><span class="sw" style="height:3px;background:var(--foreground)"></span>gemessen</span>` +
    (ok ? `<span><span class="sw" style="width:14px;height:0;border-top:3px dashed var(--foreground);border-radius:0"></span>Prognose</span>` +
      `<span><span class="sw" style="background:var(--band80)"></span>wahrscheinlich</span><span><span class="sw" style="background:var(--band90)"></span>möglich</span>` : "");
  geo = { x, y, t0, t1, m, W };
}

// House and gauge staff (round-2 Pegellatte) on the chart's scale.
function sceneSvg() {
  const colored = S.mode !== "stale", water = colored ? "var(--water)" : "var(--grey)";
  const { sx, height, top } = scene;
  let out = `<svg viewBox="${-sx} 0 ${360 + sx} ${height}" role="img" aria-label="Haus, Mauer und Pegellatte mit dem Wasserstand">`;
  out += `<rect x="${-sx}" width="${360 + sx}" height="${height}" fill="var(--sky)"/>`;
  out += `<path d="M282 ${sy(180)}V${sy(222)}L314 ${sy(248)}L346 ${sy(222)}V${sy(180)}Z" fill="var(--house)"/>`;
  out += `<rect x="294" y="${sy(212)}" width="12" height="14" rx="1" fill="var(--window)"/><rect x="322" y="${sy(212)}" width="12" height="14" rx="1" fill="var(--window)"/><rect x="309" y="${sy(200)}" width="11" height="20" fill="var(--window)"/>`;
  // Water under the terrain: the terrain hides it below the bank.
  out += `<path id="wBack" fill="${colored ? "var(--water-back)" : "var(--grey)"}" opacity=".55"/><path id="wFront" fill="${water}" opacity=".6"/>`;
  out += `<path d="M${-sx} ${sy(145)}H30L85 ${sy(-15)}H${WALL_X}V${height}H${-sx}Z" fill="var(--ground)"/>`;
  out += `<rect x="${WALL_X + 12}" y="${sy(180)}" width="${360 - WALL_X - 12}" height="${height - sy(180)}" fill="var(--ground)"/>`;
  out += `<rect x="${WALL_X}" y="${sy(185)}" width="12" height="${height - sy(185)}" fill="var(--wall)"/>`;
  CATEGORIES.forEach((c, i) => {
    const lo = i ? c.from : -15, hi = i < 4 ? CATEGORIES[i + 1].from : top;
    out += `<rect x="${STAFF_X}" y="${sy(hi)}" width="16" height="${sy(lo) - sy(hi)}" fill="${colored ? c.color : "var(--grey)"}"/>`;
    out += `<text x="${STAFF_X + 8}" y="${(sy(hi) + sy(lo)) / 2 + 4.5}" text-anchor="middle" style="fill:${!colored ? "var(--foreground)" : c.dark ? "#fff" : "oklch(18% .025 215)"}">${c.n}</text>`;
  });
  for (let cm = 0; cm < top; cm += 10) out += `<rect x="${STAFF_X}" y="${sy(cm) - .5}" width="${cm % 50 ? 4 : 7}" height="1" fill="oklch(18% .025 215)" opacity=".6"/>`;
  out += `<rect id="wStaff" x="${STAFF_X}" width="16" fill="${water}" opacity=".45"/>`;
  out += `<path id="wEdge" fill="none" stroke="${colored ? "var(--water-line)" : "var(--muted-foreground)"}" stroke-width="2" stroke-linejoin="round"/>`;
  // 90 % range on the staff, only for forecast hours.
  out += `<rect id="band" x="${STAFF_X - 5}" width="26" rx="3" fill="var(--sky)" fill-opacity=".2" stroke="var(--foreground)" stroke-opacity=".85" stroke-width="1.5" stroke-dasharray="4 2" opacity="0"/>`;
  out += `<g id="tag"><rect id="tagBox" height="24" rx="12" fill="var(--card)" stroke="var(--foreground)" stroke-opacity=".25"/><text id="tagText" text-anchor="end"></text></g>`;
  return out + `</svg>`;
}

// Two sine layers (round-2 Wasser): front small and faster, back larger and slower, the other way.
function wave(x, t, layer) {
  return layer ? 2.4 * Math.sin(x / 19 + t * 0.7 + 1.3) : 1.6 * Math.sin(x / 11 - t * 1.4) + 0.6 * Math.sin(x / 5.3 - t * 2.1);
}
const waving = () => S.mode !== "stale" && !reduceMotion.matches && !document.hidden;

function draw(t) {
  const level = levelAt(S.series, anim.shownMs), moving = waving(), { sx, height } = scene;
  const right = level > 185 ? 360 : WALL_X, base = sy(level);
  const surface = (layer) => {
    const pts = [];
    for (let xv = -sx; xv <= right + 0.1; xv += 6) pts.push([Math.min(xv, right), base + (moving ? wave(xv, t, layer) : 0) - (layer ? 2.5 : 0)]);
    return pts;
  };
  const fill = (pts) => `M${pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L")}L${right},${height}L${-sx},${height}Z`;
  const front = surface(0);
  $("wBack").setAttribute("d", fill(surface(1)));
  $("wFront").setAttribute("d", fill(front));
  const edge = front.filter((p) => p[0] >= bankX(level) - 6);
  $("wEdge").setAttribute("d", `M${edge.map((p) => `${Math.max(p[0], bankX(level)).toFixed(1)},${p[1].toFixed(1)}`).join("L")}`);
  const staffTop = base + (moving ? wave(STAFF_X + 8, t, 0) : 0);
  $("wStaff").setAttribute("y", staffTop);
  $("wStaff").setAttribute("height", Math.max(0, sy(-15) - staffTop));
  // Band on the staff and the tag follow the shown level.
  const lo = valueAt(S.series, anim.shownMs, (p) => p.band && p.band.lower), hi = valueAt(S.series, anim.shownMs, (p) => p.band && p.band.upper);
  const band = $("band");
  if (lo != null && hi != null) { band.setAttribute("y", sy(hi) - 2); band.setAttribute("height", Math.max(4, sy(lo) - sy(hi) + 4)); }
  band.setAttribute("opacity", anim.bandOpacity.toFixed(3));
  $("tag").setAttribute("transform", `translate(${STAFF_X - 10},${Math.max(16, Math.min(base - 18, sy(-8)))})`);
  if (geo) {
    const cx = geo.x(anim.shownMs);
    $("curLine").setAttribute("x1", cx); $("curLine").setAttribute("x2", cx);
    $("curDot").setAttribute("cx", cx); $("curDot").setAttribute("cy", geo.y(level));
  }
}

function step(ts) {
  const dt = anim.last ? Math.min(250, ts - anim.last) : 16;
  anim.last = ts;
  const target = S.series[anim.targetIdx], k = reduceMotion.matches ? 1 : 1 - Math.exp(-dt / 140);
  anim.shownMs += (target.ms - anim.shownMs) * k;
  if (Math.abs(target.ms - anim.shownMs) < 20e3) anim.shownMs = target.ms;
  const bandGoal = anim.active && target.forecast && target.band ? 1 : 0;
  anim.bandOpacity += (bandGoal - anim.bandOpacity) * k;
  if (Math.abs(bandGoal - anim.bandOpacity) < .01) anim.bandOpacity = bandGoal;
  draw(ts / 1000);
  const settled = anim.shownMs === target.ms && anim.bandOpacity === bandGoal;
  anim.raf = waving() || !settled ? requestAnimationFrame(step) : 0;
}
function kick() {
  cancelAnimationFrame(anim.raf);
  anim.last = 0;
  step(performance.now());
}

// Move the water to a point of the series; instant for screenshots.
function point(idx, instant = false) {
  clearTimeout(release.timer);
  anim.active = true;
  anim.targetIdx = Math.max(0, Math.min(S.series.length - 1, idx));
  if (instant) {
    $("curLine").style.transition = $("cue").style.transition = "none";
    anim.shownMs = S.series[anim.targetIdx].ms; anim.bandOpacity = S.series[anim.targetIdx].forecast ? 1 : 0;
  }
  updateLabels();
  if (!anim.raf) kick();
}
function release() {
  clearTimeout(release.timer);
  if (!anim.active) return;
  anim.active = false;
  anim.targetIdx = anim.homeIdx;
  updateLabels();
  if (!anim.raf) kick();
}
// The tag always names the shown hour; "heute" is left out, other days keep their word.
function updateLabels() {
  const p = S.series[anim.targetIdx], day = dayWord(p.iso, now);
  const text = `${day === "heute" ? "" : day + " "}${Number(parts(p.iso).hour)} Uhr · ${num(p.level)} cm`;
  $("tagText").textContent = text;
  const w = $("tagText").getComputedTextLength();
  $("tagText").setAttribute("x", -10); $("tagText").setAttribute("y", 4.5);
  $("tagBox").setAttribute("x", -w - 20); $("tagBox").setAttribute("y", -12); $("tagBox").setAttribute("width", w + 20);
  const away = anim.targetIdx !== anim.homeIdx;
  $("curLine").style.opacity = away ? 1 : 0;
  if ($("cue")) $("cue").style.opacity = away ? 0 : 1;
  chartEl.setAttribute("aria-valuenow", anim.targetIdx);
  chartEl.setAttribute("aria-valuetext", text);
}

// Mouse: follows on hover. Touch: follows from the first sideways move (a vertical swipe scrolls and leaves
// the water alone), a tap picks one hour; the picked hour stays 1.5 s after the finger lifts.
const chartEl = $("chart");
let touch = null;
function pointAtEvent(e) {
  const r = chartEl.querySelector("svg").getBoundingClientRect();
  const px = (e.clientX - r.left) * geo.W / r.width;
  point(nearestIndex(S.series, geo.t0 + (px - geo.m.l) / (geo.W - geo.m.l - geo.m.r) * (geo.t1 - geo.t0)));
}
const holdThenRelease = () => { clearTimeout(release.timer); release.timer = setTimeout(release, 1500); };
chartEl.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse") return;
  touch = { id: e.pointerId, x: e.clientX, y: e.clientY, following: false };
});
chartEl.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") return pointAtEvent(e);
  if (!touch || touch.id !== e.pointerId) return;
  if (!touch.following) {
    const dx = Math.abs(e.clientX - touch.x), dy = Math.abs(e.clientY - touch.y);
    if (dy > 8 && dy > dx) { touch = null; return; }   // the page scrolls
    if (dx < 6) return;
    touch.following = true;
    try { chartEl.setPointerCapture(e.pointerId); } catch { /* capture only keeps the drag past the chart edge */ }
  }
  pointAtEvent(e);
});
chartEl.addEventListener("pointerup", (e) => {
  if (!touch || touch.id !== e.pointerId) return;
  if (!touch.following) pointAtEvent(e);   // a tap
  touch = null;
  holdThenRelease();
});
chartEl.addEventListener("pointercancel", () => { if (touch && touch.following) holdThenRelease(); touch = null; });
chartEl.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") release(); });
chartEl.addEventListener("keydown", (e) => {
  const moves = { ArrowLeft: anim.targetIdx - 1, ArrowRight: anim.targetIdx + 1, Home: 0, End: S.series.length - 1 };
  if (e.key in moves) { e.preventDefault(); point(moves[e.key]); }
  else if (e.key === "Escape") release();
});
chartEl.addEventListener("blur", release);

document.querySelectorAll(".mock button").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.state; }));
addEventListener("hashchange", render);
addEventListener("resize", () => { clearTimeout(render.t); render.t = setTimeout(render, 150); });
// Freshness is re-checked every minute and when the tab comes back; the waves pause while hidden.
setInterval(() => { if (!anim.active) render(); }, 60e3);
document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(anim.raf); anim.raf = 0; } else render(); });
reduceMotion.addEventListener("change", kick);
document.fonts.ready.then(() => { if (!anim.active || debugHover()) render(); });
render();
</script>
</body>
</html>
