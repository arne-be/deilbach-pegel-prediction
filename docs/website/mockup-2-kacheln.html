<!doctype html>
<!--
Mockup 2 "Drei Kacheln" (round 2). Like a weather app: the level now as one
huge number, then three tiles for 3, 12 and 24 hours, each filled with the
category colour of the highest level expected by then. A dashed outline and a
corner badge mark a tile whose 90 % top reaches a higher category. The chart
with the coloured category zones follows below.
Open question for the client: barriers at Kat. 3 (165 cm) or only at 185 cm.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pegel Deilbach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..700&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  --background: oklch(99% .003 90); --foreground: oklch(20% .025 215);
  --brand: oklch(36% .04 215); --brand-deep: oklch(28% .035 215); --brand-foreground: oklch(97% .005 90);
  --accent: oklch(72% .18 50); --accent-foreground: oklch(18% .025 215);
  --muted-foreground: oklch(48% .02 215); --border: oklch(90% .008 210); --card: #fff;
  --header: oklch(99% .003 90);
  /* Severity scale; Kat. 3 darker and redder than the brand orange (hue 50). */
  --c1: oklch(70% .13 155); --c2: oklch(86% .15 92); --c3: oklch(55% .19 30);
  --c4: oklch(50% .2 25); --c5: oklch(33% .12 15);
  --c1-ink: oklch(22% .04 155); --c2-ink: oklch(25% .05 80); --c3-ink: #fff;
  --c4-ink: #fff; --c5-ink: #fff;
  --band80: oklch(36% .04 215 / .30); --band90: oklch(36% .04 215 / .13);
  --grey: oklch(88% .005 215); --grey-ink: oklch(30% .01 215);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(18% .025 215); --foreground: oklch(97% .005 90);
    --card: oklch(22% .025 215); --muted-foreground: oklch(75% .02 215);
    --border: oklch(34% .02 215); --header: oklch(20% .025 215);
    --band80: oklch(85% .04 215 / .32); --band90: oklch(85% .04 215 / .14);
    --grey: oklch(34% .01 215); --grey-ink: oklch(92% .005 215);
  }
}
:root[data-theme="dark"] {
  --background: oklch(18% .025 215); --foreground: oklch(97% .005 90);
  --card: oklch(22% .025 215); --muted-foreground: oklch(75% .02 215);
  --border: oklch(34% .02 215); --header: oklch(20% .025 215);
  --band80: oklch(85% .04 215 / .32); --band90: oklch(85% .04 215 / .14);
  --grey: oklch(34% .01 215); --grey-ink: oklch(92% .005 215);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--background); color: var(--foreground);
  font: 16px/1.5 "Manrope", system-ui, sans-serif; overflow-x: hidden; }
h1, h2, .num, .wordmark { font-family: "Space Grotesk", system-ui, sans-serif; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
/* Short states still keep the footer off the first screen */
main { min-height: calc(100vh - 64px); }

/* Header as on energiekonzepte-ruhr.de */
header.site { background: var(--header); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header.site .wrap { display: flex; align-items: center; height: 64px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand img { width: 40px; height: 40px; border-radius: 8px; background: var(--brand); display: block; }
.wordmark { font-size: 13px; font-weight: 700; letter-spacing: .2em; }
header nav { flex: 1; display: flex; justify-content: center; gap: 28px; font-size: 14px; color: var(--muted-foreground); }
header nav a { text-decoration: none; }
.cta { background: var(--accent); color: var(--accent-foreground); border-radius: 999px; padding: 8px 18px;
  font-size: 12px; font-weight: 600; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
.burger { display: none; margin-left: auto; background: none; border: 0; padding: 8px; color: var(--foreground); }
@media (max-width: 900px) { header nav, header .cta { display: none; } .burger { display: block; } }

/* Hero: the client's photo with its amber tint, the level now on top */
.hero { color: #fff; text-align: center; padding: 22px 16px 26px;
  background: linear-gradient(oklch(32% .06 70 / .62), oklch(16% .03 60 / .78)),
    url("https://energiekonzepte-ruhr.de/assets/hero-zollverein-BXlhPzUy.jpg") center 30% / cover, oklch(30% .05 70); }
.hero h1 { margin: 0; font-size: clamp(20px, 3vw, 32px); font-weight: 500; text-transform: uppercase; letter-spacing: .12em; }
@media (min-width: 700px) { .hero { padding: 40px 16px 44px; } }
.now { font-size: clamp(76px, 12vw, 120px); font-weight: 600; line-height: 1; margin: 8px 0 0; letter-spacing: -.02em; }
.now small { font-size: .3em; font-weight: 500; margin-left: .15em; letter-spacing: 0; }
.badge-old { display: inline-block; margin-top: 12px; border-radius: 999px; padding: 2px 12px; font-weight: 700; font-size: 14px; background: #fff; color: oklch(20% .025 215); }
body.is-old .hero { filter: grayscale(1); }
body.is-old .hero .now { color: oklch(82% 0 0); }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 720px; margin: 28px auto 0; }
@media (min-width: 700px) { .tiles { gap: 28px; } }
.tile { position: relative; aspect-ratio: 1; border-radius: 1rem; padding: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  background: var(--bg); color: var(--ink); box-shadow: 0 6px 20px oklch(20% .025 215 / .12); }
.tile .h { font-size: 14px; font-weight: 600; }
.tile .v { font-size: clamp(34px, 7vw, 64px); font-weight: 600; line-height: 1.05; }
.tile .v small { font-size: .38em; margin-left: .1em; }
/* Category number in a circle; a possible higher category as a second, dashed circle */
.tile .k { display: flex; gap: 6px; margin: 4px 0 2px; }
.tile .k b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px;
  border: 2px solid currentColor; }
.tile .k b.up { border-style: dashed; }
.tile .t { font-size: clamp(13px, 2vw, 16px); }
.issued { text-align: center; margin: 28px 0 0; }
.portal { display: inline-block; background: var(--accent); color: var(--accent-foreground);
  border-radius: 999px; padding: 12px 26px; font-weight: 600; text-decoration: none; }

.card { background: var(--card); border-radius: 1rem; box-shadow: 0 6px 24px oklch(20% .025 215 / .08);
  padding: 12px 10px 6px; max-width: 960px; margin: 32px auto 0; }
#chart svg { display: block; width: 100%; height: auto; font: 12px "Manrope", sans-serif; fill: var(--muted-foreground); }
/* Halo so labels stay readable over lines and bands */
#chart text { paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round; }
details { max-width: 960px; margin: 24px auto 0; background: var(--card); border-radius: 1rem;
  box-shadow: 0 6px 24px oklch(20% .025 215 / .08); padding: 14px 16px; }
summary { cursor: pointer; font-family: "Space Grotesk"; font-weight: 600; font-size: 18px; }
details ul { list-style: none; margin: 10px 0 0; padding: 0; }
details li { display: flex; gap: 12px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--border); }
details li b { min-width: 64px; font-family: "Space Grotesk"; }
details li.hit { font-weight: 700; }
details li.hit::after, details li.maybe::after { content: ""; width: 12px; height: 12px; border-radius: 50%; margin-left: auto; align-self: center; }
details li.hit::after { background: var(--c3); }
details li.maybe::after { border: 2px dashed var(--c3); }

.disclaimer { text-align: center; font-size: 13px; color: var(--muted-foreground); margin: 48px 0 24px; }
.disclaimer a { color: var(--accent); font-weight: 600; text-decoration: none; }
footer.site { background: var(--brand-deep); color: var(--brand-foreground); font-size: 14px; padding: 28px 0; }
footer.site .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

/* Mockup only */
.mock { display: flex; gap: 2px; opacity: .6; font-size: 12px; }
.mock button { font: inherit; border: 0; background: none; color: inherit; padding: 1px 5px; border-radius: 4px; cursor: pointer; }
.mock button[aria-pressed="true"] { background: var(--brand-foreground); color: var(--brand-deep); }
</style>
</head>

<script id="logic">
// Pure logic, no DOM. In the real page CATS, ACTIONS, MODEL and the stale limit come from config/pegel.json.
const HOUR = 3600e3, STALE_MS = 90 * 60e3, MARKS = [3, 12, 24], MODEL = "ridge:change:v2";
const CATS = [
  { n: 1, name: "unkritisch", from: -Infinity },
  { n: 2, name: "kritisch", from: 145 },
  { n: 3, name: "sehr kritisch", from: 165 },
  { n: 4, name: "extrem kritisch", from: 185 },
  { n: 5, name: "Chaos", from: 225 },
];
// Barriers: Kat. 3 (165 cm) per the category table; whether it should be 185 cm is open.
const ACTIONS = [
  { level: 165, label: "165 cm", text: "Rückstauventil, Pumpe" },
  { level: 165, label: "Kat. 3", text: "Barrieren" },
  { level: 185, label: "185 cm", text: "Sandsäcke" },
  { level: 225, label: "225 cm", text: "EG räumen, Strom aus" },
];

// Strictly above the threshold, as in core/categories.py: 145,0 cm is category 1.
function category(level) { let c = CATS[0]; for (const k of CATS) if (level > k.from) c = k; return c; }
function band(point, coverage) { return point.bands.find((b) => b.coverage_percent === coverage) || null; }
function upper90(point) { const b = band(point, 90); return b ? b.upper_cm : null; }

const berlin = (opts) => new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", ...opts });
const fTime = berlin({ hour: "2-digit", minute: "2-digit" });
const fDate = berlin({ year: "numeric", month: "2-digit", day: "2-digit" });
// Own weekday names: ICU builds differ on "Fr" vs "Fr.".
const fWeekdayEn = new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Berlin", weekday: "short" });
const WEEKDAYS = { Sun: "So.", Mon: "Mo.", Tue: "Di.", Wed: "Mi.", Thu: "Do.", Fri: "Fr.", Sat: "Sa." };
function weekday(ms) { return WEEKDAYS[fWeekdayEn.format(new Date(ms))]; }
const fHour = berlin({ hour: "numeric", hourCycle: "h23" });
function berlinHour(ms) { return Number(fHour.formatToParts(new Date(ms)).find((p) => p.type === "hour").value); }
function berlinDay(ms) { return fDate.format(new Date(ms)); }
function fmtClock(iso) { return fTime.format(new Date(iso)) + " Uhr"; }
// Forecast times to the hour; after midnight with the weekday ("Fr. 3 Uhr").
function hourLabel(iso, refMs) {
  const ms = Date.parse(iso);
  return (berlinDay(ms) === berlinDay(refMs) ? "" : weekday(ms) + " ") + berlinHour(ms) + " Uhr";
}
const whole = (v) => Math.round(v).toLocaleString("de-DE");

function isFallback(forecast) {
  return forecast.model !== MODEL || forecast.points.length === 0 || forecast.points.every((p) => p.bands.length === 0);
}

// Windows by time (valid_at minus the newest observation), not by array index.
function windowSummary(points, obsMs, hours) {
  const w = points.filter((p) => (Date.parse(p.valid_at) - obsMs) / HOUR <= hours + 0.1);
  if (!w.length) return { hours, empty: true };
  let peak = w[0], upper = null;
  for (const p of w) {
    if (p.level_cm > peak.level_cm) peak = p;
    const u = upper90(p);
    if (u !== null && (upper === null || u > upper)) upper = u;
  }
  return { hours, empty: false, peak, cat: category(peak.level_cm), possibleCat: upper === null ? null : category(upper) };
}

function trend3h(observations) {
  const last = observations[observations.length - 1], target = Date.parse(last.observed_at) - 3 * HOUR;
  const before = observations.find((o) => Math.abs(Date.parse(o.observed_at) - target) <= 10 * 60e3);
  return before ? last.level_cm - before.level_cm : null;
}

function freshness(forecast, newestObsIso, nowMs) {
  const obsAge = nowMs - Date.parse(newestObsIso), fcAge = nowMs - Date.parse(forecast.issued_at);
  return { obsAge, fcAge, stale: obsAge > STALE_MS || fcAge > STALE_MS };
}

function summarize(forecast, history, nowMs) {
  const obs = history.observations, now = obs[obs.length - 1];
  const obsMs = Date.parse(forecast.newest_observation_at);
  const mode = freshness(forecast, now.observed_at, nowMs).stale ? "stale" : isFallback(forecast) ? "fallback" : "fresh";
  const pts = forecast.points;
  return {
    f: forecast, history: obs, now, nowCat: category(now.level_cm), trend: trend3h(obs), nowMs, mode,
    marks: MARKS.map((h) => windowSummary(pts, obsMs, h)), all: windowSummary(pts, obsMs, 24),
  };
}

// The one status phrase. Stale and fallback give no verdict.
function statusText(s) {
  if (s.mode === "stale") return "Veraltet";
  if (s.mode === "fallback") return "Keine Prognose";
  const E = s.all.cat.n, P = s.all.possibleCat ? s.all.possibleCat.n : E;
  if (E > 1) return `Kat. ${E} erwartet` + (P > E ? `, ${P} möglich` : "");
  if (P > 1) return `Kat. ${P} möglich`;
  return "Kein Hochwasser";
}

function trendText(t) {
  if (t === null) return "";
  if (Math.abs(t) < 2) return "→";
  return `${t > 0 ? "↗ +" : "↘ −"}${whole(Math.abs(t))} cm`;
}

// Which actions the forecast line reaches ("hit") or only the 90 % top ("maybe").
function actionStates(s) {
  const pts = s.f.points;
  return ACTIONS.map((a) => ({
    ...a,
    state: pts.some((p) => p.level_cm > a.level) ? "hit" : pts.some((p) => (upper90(p) ?? -1) > a.level) ? "maybe" : "",
  }));
}

if (typeof module !== "undefined") module.exports = { CATS, category, windowSummary, freshness, isFallback, summarize, statusText, trendText, actionStates, hourLabel, whole };
</script>

if (typeof document !== "undefined") (() => {

  // Mockup clock: "now" is fixed per state. The real page uses Date.now().
  const STATES = {
    normal: { label: "Normal", forecast: SAMPLES.normal.forecast, history: SAMPLES.normal.history, now: "2026-10-16T09:41:00Z" },

  let current = "normal", last = null;

  function render(state) {
    const st = STATES[state], s = summarize(st.forecast, st.history, Date.parse(st.now));
    last = s;
    const old = s.mode !== "fresh";
    document.body.classList.toggle("is-old", s.mode === "stale");

    $("now").innerHTML = `${whole(s.now.level_cm)}<small>cm</small>`;
    // Stale and fallback: a badge with the time of the newest reading, no verdict.
    $("meta").innerHTML = old ? `<span class="badge-old">${statusText(s)} · ${fmtClock(s.now.observed_at)}</span>` : "";
    $("tiles").hidden = old;
    $("issued").hidden = !old;
    $("disclaimer").hidden = old; // the portal button carries the link then
    if (!old) renderTiles(s);
    renderChart(s);
    renderTodo(s);

  function renderTiles(s) {

    const top = Math.max(...pts.map((p) => upper90(p) ?? p.level_cm), ...hist.map((o) => o.level_cm));
    const yMax = Math.max(160, Math.ceil((top + 10) / 20) * 20);
    const x = (t) => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - v / yMax) * (H - m.t - m.b);
    const out = [];
    // Category zones with their number inside; no y axis, the zones are the scale.
    CATS.forEach((c, i) => {
      const lo = Math.max(0, c.from), hi = Math.min(yMax, CATS[i + 1] ? CATS[i + 1].from : yMax);
      if (lo >= yMax) return;
      const fill = fresh ? `fill="${css(c.n)}" opacity="${c.n === 1 ? 0.14 : 0.3}"` : `fill="var(--grey)" opacity="${0.35 + 0.15 * c.n}"`;
      out.push(`<rect x="${m.l}" y="${y(hi)}" width="${W - m.l - m.r}" height="${y(lo) - y(hi)}" ${fill}/>`);
      if (y(lo) - y(hi) >= 14) out.push(`<text x="${m.l + 6}" y="${(y(hi) + Math.min(y(lo), y(hi) + 40)) / 2 + 4}" font-weight="700" style="fill:var(--foreground)">${c.n}</text>`);
    });
    for (let t = Math.ceil(t0 / HOUR) * HOUR; t <= t1; t += HOUR) {
      const hr = berlinHour(t);
      if (hr % (phone ? 12 : 6)) continue;
      out.push(`<line x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--foreground)" stroke-opacity=".12"/>`);
      out.push(`<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${hr === 0 ? weekday(t) : `${hr} Uhr`}</text>`);
    }
    const start = { t: obsT, v: s.now.level_cm };
    const bandPts = (cov) => pts.map((p) => ({ t: Date.parse(p.valid_at), v: p.level_cm, b: band(p, cov) })).filter((q) => q.b);
    const area = (cov) => {
      const bs = bandPts(cov);
      if (!bs.length) return "";
      const up = [`${x(start.t)},${y(start.v)}`, ...bs.map((q) => `${x(q.t)},${y(q.b.upper_cm)}`)];
      return `<polygon points="${[...up, ...bs.map((q) => `${x(q.t)},${y(q.b.lower_cm)}`).reverse()].join(" ")}" fill="var(--band${cov})"/>`;
    };
    out.push(area(90), area(80));
    // One direct label per band, at the widest hour up to +20 h so the text ends inside the chart.
    const b90 = bandPts(90).filter((q) => q.t <= obsT + 20 * HOUR);
    if (b90.length) {
      const w = b90.reduce((a, q) => (q.b.upper_cm - q.b.lower_cm > a.b.upper_cm - a.b.lower_cm ? q : a));
      const b80 = band(pts.find((p) => Date.parse(p.valid_at) === w.t), 80);
      out.push(`<text x="${x(w.t)}" y="${y(w.b.upper_cm) - 4}" text-anchor="end" style="fill:var(--foreground)">möglich</text>`);
      // "wahrscheinlich" inside the dark band, on the side of the line with more room.
      const above = y(w.v) - y(b80.upper_cm), below = y(b80.lower_cm) - y(w.v);
      if (Math.max(above, below) >= 15) {
        const ly = above >= below ? (y(w.v) + y(b80.upper_cm)) / 2 : (y(w.v) + y(b80.lower_cm)) / 2;
        out.push(`<text x="${x(w.t)}" y="${ly + 4}" text-anchor="end" style="fill:var(--foreground)">wahrscheinlich</text>`);
      }
    }
    const line = (arr) => arr.map((q, i) => `${i ? "L" : "M"}${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join("");
    out.push(`<path d="${line(hist.map((o) => ({ t: Date.parse(o.observed_at), v: o.level_cm })))}" fill="none" stroke="var(--foreground)" stroke-width="2.4"/>`);
    if (pts.length) out.push(`<path d="${line([start, ...pts.map((p) => ({ t: Date.parse(p.valid_at), v: p.level_cm }))])}" fill="none" stroke="var(--foreground)" stroke-width="2.4" stroke-dasharray="6 4"/>`);
    out.push(`<circle cx="${x(obsT)}" cy="${y(s.now.level_cm)}" r="5" fill="var(--foreground)" stroke="var(--card)" stroke-width="2"/>`);
    out.push(`<text x="${x(obsT)}" y="${y(s.now.level_cm) - 10}" text-anchor="middle" font-weight="700" style="fill:var(--foreground)">${fresh ? "Jetzt" : fTime.format(new Date(obsT))}</text>`);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${out.join("")}</svg>`;
    box.setAttribute("aria-label", `Pegelverlauf, zuletzt ${whole(s.now.level_cm)} cm` + (fresh ? `, erwartet höchstens ${whole(s.all.peak.level_cm)} cm` : ", keine aktuelle Prognose"));
  }

  function select(state) {
    if (!STATES[state]) state = "normal";
    current = state;
    for (const b of $("mock").children) b.setAttribute("aria-pressed", String(b.dataset.state === state));
    render(state);
  }
  $("mock").innerHTML = Object.entries(STATES).map(([k, v]) => `<button data-state="${k}">${v.label}</button>`).join("");
  $("mock").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.state; });
  addEventListener("hashchange", () => select(location.hash.slice(1)));
  // Freshness is re-checked every minute and when the tab comes back; the real page uses Date.now() here.
  setInterval(() => render(current), 60e3);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(current); });
  let resizeTimer;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => render(current), 100); });
  select(location.hash.slice(1));
})();
</script>
</body>
</html>
