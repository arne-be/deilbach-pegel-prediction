<script id="core">
// Pure logic, mirrors what the React component would do. No DOM in here.
// shortcut: categories and actions copied from config/pegel.json; the real page gets them from the API.
const CATEGORIES = [
  { n: 1, name: "unkritisch", from: -Infinity, color: "var(--c1)" },
  { n: 2, name: "kritisch", from: 145, color: "var(--c2)" },
  { n: 3, name: "sehr kritisch", from: 165, color: "var(--c3)", dark: true },
  { n: 4, name: "extrem kritisch", from: 185, color: "var(--c4)", dark: true },
  { n: 5, name: "Chaos", from: 225, color: "var(--c5)", dark: true },
];
const ACTIONS = [
  { at: 165, label: "165 cm", text: "Rückstauventil, Pumpe" },
  { at: 165, label: "Kat. 3", text: "Barrieren" },
  { at: 185, label: "185 cm", text: "Sandsäcke" },
  { at: 225, label: "225 cm", text: "EG räumen, Strom aus" },
];
const MODEL = "ridge:change:v2", STALE_MINUTES = 90, LEADS = [3, 12, 24];

// Strictly above the threshold, as in core/categories.py: 145,0 cm is still Kat. 1.
const categoryOf = (cm) => CATEGORIES.filter((c) => cm > c.from).pop();
const bandOf = (p, coverage) => p.bands.find((b) => b.coverage_percent === coverage) || null;
const upper90 = (p) => (bandOf(p, 90) ? bandOf(p, 90).upper_cm : p.level_cm);
const hoursAfter = (iso, startIso) => (Date.parse(iso) - Date.parse(startIso)) / 3600e3;
const isFallback = (f) => f.model !== MODEL || f.points.some((p) => !p.bands.length);
// Hour of the last point BEFORE the crossing (shared rule); the newest reading if the first point already crosses.
function crossingTime(forecast, cm, valueOf) {
  const i = forecast.points.findIndex((p) => valueOf(p) > cm);
  return i < 0 ? null : i === 0 ? forecast.newest_observation_at : forecast.points[i - 1].valid_at;
}

// Highest expected level up to `hours` after the newest reading, by time, not by index.
function windowMax(forecast, hours) {
  const points = forecast.points.filter((p) => hoursAfter(p.valid_at, forecast.newest_observation_at) <= hours + 0.01);
  if (!points.length) return null;
  const top = points.reduce((a, b) => (b.level_cm > a.level_cm ? b : a));
  const range = (coverage) => points.every((p) => bandOf(p, coverage))
    ? { lower: Math.max(...points.map((p) => bandOf(p, coverage).lower_cm)), upper: Math.max(...points.map((p) => bandOf(p, coverage).upper_cm)) }
    : null;
  const r80 = range(80), r90 = range(90);
  return { hours, level: top.level_cm, at: top.valid_at, category: categoryOf(top.level_cm), r80, r90,
    possibleCategory: categoryOf(r90 ? r90.upper : top.level_cm) };
}

// The line sets the category; the highest category the 90 % top reaches is shown too, with its earliest time.
function verdict(forecast, currentCm) {
  const expected = categoryOf(Math.max(...forecast.points.map((p) => p.level_cm)));
  const expectedAt = expected.n > categoryOf(currentCm).n ? crossingTime(forecast, expected.from, (p) => p.level_cm) : null;
  const top = categoryOf(Math.max(...forecast.points.map(upper90)));
  const possible = top.n > expected.n ? { category: top, at: crossingTime(forecast, top.from, upper90) } : null;
  return { expected, expectedAt, possible };
}

function actionPlan(forecast, currentCm) {
  return ACTIONS.map((a) => ({
    ...a,
    due: currentCm > a.at,
    expectedAt: crossingTime(forecast, a.at, (p) => p.level_cm),
    possibleAt: crossingTime(forecast, a.at, upper90),
  }));
}

function summarize(sample, nowIso) {
  const f = sample.forecast, obs = sample.history.observations;
  const current = obs[obs.length - 1];
  const ageMin = (iso) => (Date.parse(nowIso) - Date.parse(iso)) / 60e3;
  const stale = ageMin(current.observed_at) > STALE_MINUTES || ageMin(f.issued_at) > STALE_MINUTES;
  const fallback = isFallback(f);
  const mode = stale ? "stale" : fallback ? "fallback" : "ok";
  return { mode, current, leads: LEADS.map((h) => windowMax(f, h)),
    verdict: verdict(f, current.level_cm), plan: actionPlan(f, current.level_cm) };
}

// Formatting (German, Europe/Berlin)
const TZ = "Europe/Berlin";
const num = (v) => Math.round(v).toLocaleString("de-DE");
const parts = (iso) => Object.fromEntries(new Intl.DateTimeFormat("de-DE", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" })
  .formatToParts(new Date(iso)).map((p) => [p.type, p.value]));
const sameDay = (a, b) => parts(a).day === parts(b).day && parts(a).month === parts(b).month;
// Hour level; times on another day carry the weekday ("Fr. 3 Uhr").
const hour = (iso, nowIso) => `${sameDay(iso, nowIso) ? "" : parts(iso).weekday + " "}${Number(parts(iso).hour)} Uhr`;
const clock = (iso) => `${parts(iso).hour}:${parts(iso).minute} Uhr`;
if (typeof module !== "undefined") module.exports = { summarize, windowMax, verdict, actionPlan, categoryOf, isFallback, hour, clock, num };
</script>
<script>
const SAMPLES = JSON.parse(document.getElementById("data").textContent);
// Mockup only: a persistence forecast (flat at the last level, no bands) on the flood history.
const fallbackSample = {
  history: SAMPLES.flood_made_up.history,
  forecast: { ...SAMPLES.flood_made_up.forecast, model: "persistence", situation: null,
    points: SAMPLES.flood_made_up.forecast.points.map((p) => ({ valid_at: p.valid_at, level_cm: 128, bands: [] })) },
};
// Mockup only: the "now" each state is viewed at. The real page uses new Date().
const STATES = {
  normal: { sample: SAMPLES.normal, now: "2026-10-16T09:41:00Z" },
  flood: { sample: SAMPLES.flood_made_up, now: "2026-11-19T15:41:00Z" },
  stale: { sample: SAMPLES.flood_made_up, now: "2026-11-19T17:40:00Z" },
  fallback: { sample: fallbackSample, now: "2026-11-19T15:41:00Z" },
};
const stateFromHash = () => (location.hash.slice(1) in STATES ? location.hash.slice(1) : "normal");
const $ = (id) => document.getElementById(id);
const PORTAL = `<a href="https://www.hochwasserportal.nrw.de">Hochwasserportal NRW</a>`;
const chip = (c, text, cls = "") => `<span class="chip ${c.dark ? "dark" : ""} ${cls}" style="background:${c.color};--chip:${c.color}">${text}</span>`;

function render() {
  const name = stateFromHash(), { sample, now } = STATES[name], s = summarize(sample, now), ok = s.mode === "ok";
  document.body.classList.toggle("is-old", s.mode === "stale");
  document.querySelectorAll(".mock button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.state === name));

  const v = s.verdict;
  const reading = clock(s.current.observed_at);
  $("status").innerHTML = s.mode === "stale" ? `<span class="badge">Veraltet · ${reading}</span>${PORTAL}`
    : s.mode === "fallback" ? `<span class="badge">Keine Prognose · ${reading}</span>${PORTAL}`
    : `<span>${chip(v.expected, `${v.expected.n} · ${v.expected.name}`)}${v.expectedAt ? ` gegen ${hour(v.expectedAt, now)}` : ""}</span>` +
      (v.possible ? `<span><span class="maybe" style="--chip:${v.possible.category.color}">${v.possible.category.n}</span>ab ${hour(v.possible.at, now)}</span>` : "");
  // The reading time stays under the number when fresh: never show a level without its time.
  $("now").innerHTML = `<div class="big">${num(s.current.level_cm)}<small>cm</small></div>` + (ok ? `<div class="meta">${reading}</div>` : "");
  $("scene").innerHTML = sceneSvg(s);
  $("chart").innerHTML = chartSvg(sample, s, now, $("chart").clientWidth - 24);
  $("plan").innerHTML = s.plan.map((a) => {
    const when = !ok ? "" : a.due ? `<span class="when exp">jetzt</span>`
      : a.expectedAt ? `<span class="when exp">${hour(a.expectedAt, now)}</span>`
      : a.possibleAt ? `<span class="when">möglich ${hour(a.possibleAt, now)}</span>` : "";
    return `<li><b>${a.label}</b><span>${a.text}</span>${when}</li>`;
  }).join("");
}

// Cross-section, 1 SVG unit = 1 cm. Level 250 at y 20, bed (-15) at y 285.
function sceneSvg(s) {
  const ok = s.mode === "ok", y = (cm) => 270 - Math.max(-20, Math.min(cm, 255));
  const staffX = 232, wallX = 248, level = s.current.level_cm;
  const waterFill = ok ? "var(--water)" : "var(--grey)";
  const bankX = (cm) => (cm >= 145 ? 0 : 30 + (145 - cm) / 160 * 55); // left bank slope: 145 cm at x 30, bed at x 85
  let out = `<svg viewBox="0 0 360 300" role="img" aria-label="Pegellatte mit Wasserstand ${num(level)} cm">`;
  out += `<rect width="360" height="300" fill="var(--sky)"/>`;
  // House behind the wall.
  out += `<path d="M282 ${y(180)}V${y(222)}L314 ${y(248)}L346 ${y(222)}V${y(180)}Z" fill="var(--house)"/>`;
  out += `<rect x="294" y="${y(212)}" width="12" height="14" rx="1" fill="var(--window)"/><rect x="322" y="${y(212)}" width="12" height="14" rx="1" fill="var(--window)"/><rect x="309" y="${y(200)}" width="11" height="20" fill="var(--window)"/>`;
  // Water first, terrain on top hides it below ground; above 185 cm it spills over the wall.
  out += `<rect x="0" y="${y(level)}" width="${level > 185 ? 360 : wallX}" height="${300 - y(level)}" fill="${waterFill}" opacity=".55"/>`;
  out += `<path d="M0 ${y(145)}H30L85 ${y(-15)}H${wallX}V300H0Z" fill="var(--ground)"/>`;
  out += `<rect x="${wallX + 12}" y="${y(180)}" width="${360 - wallX - 12}" height="${300 - y(180)}" fill="var(--ground)"/>`;
  out += `<rect x="${wallX}" y="${y(185)}" width="12" height="${300 - y(185)}" fill="var(--wall)"/>`;
  // Staff: five painted segments with the category number, ticks every 10 cm.
  CATEGORIES.forEach((c, i) => {
    const lo = i ? c.from : -15, hi = i < 4 ? CATEGORIES[i + 1].from : 250;
    out += `<rect x="${staffX}" y="${y(hi)}" width="16" height="${y(lo) - y(hi)}" fill="${ok ? c.color : "var(--grey)"}"/>`;
    out += `<text x="${staffX + 8}" y="${(y(hi) + y(lo)) / 2 + 4.5}" text-anchor="middle" style="fill:${ok && c.dark ? "#fff" : "oklch(18% .025 215)"}">${c.n}</text>`;
  });
  for (let cm = 0; cm < 250; cm += 10) out += `<rect x="${staffX}" y="${y(cm) - .5}" width="${cm % 50 ? 4 : 7}" height="1" fill="oklch(18% .025 215)" opacity=".6"/>`;
  out += `<rect x="${staffX}" y="${y(level)}" width="16" height="${y(-15) - y(level)}" fill="${waterFill}" opacity=".45"/>`;
  out += `<line x1="${bankX(level)}" x2="${level > 185 ? 360 : wallX}" y1="${y(level)}" y2="${y(level)}" stroke="${ok ? "var(--water-line)" : "var(--muted-foreground)"}" stroke-width="2"/>`;
  if (!ok) return out + `</svg>`;
  // Ghost waterlines: each label sits on its own line at the staff end; equal levels share one label,
  // a label that would overlap the one above moves left along its line.
  const groups = [];
  s.leads.filter(Boolean).forEach((l) => {
    const same = groups.find((g) => num(g.level) === num(l.level));
    if (same) same.hours.push(l.hours); else groups.push({ ...l, hours: [l.hours] });
  });
  groups.sort((a, b) => b.level - a.level);
  const placed = [];
  groups.forEach((g) => {
    const higher = g.possibleCategory.n > g.category.n, ly = y(g.level);
    const width = Math.max(40 + (higher ? 24 : 0), g.hours.length > 1 ? 66 : 42);
    let right = staffX - 6;
    placed.filter((p) => Math.abs(p.ly - ly) < 38).forEach((p) => { right = Math.min(right, p.left - 8); });
    const left = right - width;
    placed.push({ ly, left });
    out += `<line x1="${bankX(g.level)}" x2="${staffX}" y1="${ly}" y2="${ly}" stroke="var(--foreground)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    const px = left + (width - (higher ? 64 : 40)) / 2, c = g.category;
    out += `<rect x="${px}" y="${ly - 10.5}" width="40" height="21" rx="10.5" fill="${c.color}"/>`;
    out += `<text class="lvl" x="${px + 20}" y="${ly + 5.5}" text-anchor="middle" style="fill:${c.dark ? "#fff" : "oklch(18% .025 215)"}">${num(g.level)}</text>`;
    if (higher) out += `<circle cx="${px + 54}" cy="${ly}" r="10" fill="var(--sky)" stroke="${g.possibleCategory.color}" stroke-width="2" stroke-dasharray="3 2"/><text x="${px + 54}" y="${ly + 4.5}" text-anchor="middle">${g.possibleCategory.n}</text>`;
    out += `<text x="${left + width / 2}" y="${ly - 15}" text-anchor="middle">${g.hours.join(" · ")} Std.</text>`;
  });
  return out + `</svg>`;
}

// Coloured-steps chart: category zones behind the last 24 h measured and the 24 h forecast.
function chartSvg(sample, s, now, width) {
  const ok = s.mode === "ok", f = sample.forecast;
  const W = Math.max(300, width), H = 240, L = 4, R = 4, T = 8, B = 24;
  const t0 = Date.parse(s.current.observed_at);
  const obs = sample.history.observations.filter((o) => (t0 - Date.parse(o.observed_at)) / 3600e3 <= 24);
  const xs = (iso) => L + ((Date.parse(iso) - t0) / 3600e3 + 24) / 48 * (W - L - R);
  const values = [...obs.map((o) => o.level_cm), ...(ok ? f.points.map(upper90) : [])];
  const yMax = Math.max(160, Math.ceil((Math.max(...values) + 15) / 10) * 10);
  const ys = (v) => T + (1 - Math.min(v, yMax) / yMax) * (H - T - B);
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pegel der letzten 24 Stunden${ok ? " und Prognose" : ""}">`;
  CATEGORIES.forEach((c, i) => {
    const lo = i ? c.from : 0, hi = i < 4 ? CATEGORIES[i + 1].from : Infinity;
    if (lo >= yMax) return;
    const y0 = ys(hi), y1 = ys(lo);
    out += `<rect x="${L}" y="${y0}" width="${W - L - R}" height="${y1 - y0}" fill="${ok ? c.color : "var(--grey)"}" opacity="${ok ? .22 : .25}"/>`;
    if (y1 - y0 >= 14) out += `<text class="zone halo" x="${W - R - 6}" y="${y0 + 14}" text-anchor="end">${c.n}</text>`;
  });
  const band = (cov, op) => {
    const pts = f.points.filter((p) => bandOf(p, cov));
    if (!ok || !pts.length) return "";
    return `<path d="M${pts.map((p) => `${xs(p.valid_at)},${ys(bandOf(p, cov).upper_cm)}`).join("L")}L${pts.slice().reverse().map((p) => `${xs(p.valid_at)},${ys(bandOf(p, cov).lower_cm)}`).join("L")}Z" fill="var(--foreground)" opacity="${op}"/>`;
  };
  out += band(90, .12) + band(80, .2);
  const xNow = xs(s.current.observed_at);
  out += `<line x1="${xNow}" x2="${xNow}" y1="${T}" y2="${H - B}" stroke="var(--foreground)" stroke-opacity=".5"/>`;
  out += `<polyline points="${obs.map((o) => `${xs(o.observed_at)},${ys(o.level_cm)}`).join(" ")}" fill="none" stroke="var(--foreground)" stroke-width="2.5" stroke-linejoin="round"/>`;
  if (ok) out += `<polyline points="${[{ valid_at: s.current.observed_at, level_cm: s.current.level_cm }, ...f.points].map((p) => `${xs(p.valid_at)},${ys(p.level_cm)}`).join(" ")}" fill="none" stroke="var(--foreground)" stroke-width="2.5" stroke-dasharray="6 4"/>`;
  out += `<circle cx="${xNow}" cy="${ys(s.current.level_cm)}" r="5" fill="var(--foreground)"/>`;
  // Time ticks every 6 h on the Berlin clock; midnight shows the weekday.
  for (let h = -24; h <= 24; h++) {
    const iso = new Date(t0 + h * 3600e3).toISOString(), p = parts(iso);
    if (Number(p.hour) % (W < 500 ? 12 : 6)) continue;
    const x = xs(iso);
    if (x < L + 14 || x > W - R - 14) continue;
    out += `<text x="${x}" y="${H - 6}" text-anchor="middle" ${p.hour === "00" ? 'style="font-weight:700;fill:var(--foreground)"' : ""}>${p.hour === "00" ? p.weekday : Number(p.hour) + " Uhr"}</text>`;
  }
  out += `<text x="${xNow}" y="${T + 12}" text-anchor="middle" class="zone" style="paint-order:stroke;stroke:var(--card);stroke-width:4px">${ok ? "Jetzt" : clock(s.current.observed_at)}</text>`;
  return out + `</svg>`;
}

document.querySelectorAll(".mock button").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.state; }));
addEventListener("hashchange", render);
addEventListener("resize", render);
// Freshness must be re-evaluated while the page stays open overnight.
setInterval(render, 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
render();
</script>
